<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - RedMecánica</title>
  <meta name="description" content="No tienes conexión a internet. RedMecánica no está disponible en este momento.">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
    .container{max-width:500px;padding:2rem}
    .icon{width:96px;height:96px;margin:0 auto 2rem;background:rgba(99,102,241,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .icon svg{width:48px;height:48px;color:#6366f1}
    h1{font-size:2.5rem;font-weight:700;margin-bottom:1rem;background:linear-gradient(135deg,#6366f1,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    p{font-size:1.125rem;line-height:1.6;margin-bottom:2rem;color:#94a3b8}
    .btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,#6366f1,#818cf8);color:white;border:none;border-radius:0.75rem;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s ease}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(99,102,241,0.3)}
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M8.5 8.5c-.83.83-1.5 2.1-1.5 3.5 0 2.76 2.24 5 5 5 1.4 0 2.67-.67 3.5-1.5M18 18a9 9 0 01-12-12 9 9 0 0112 12z"/></svg>
    </div>
    <h1>Sin conexión</h1>
    <p>Parece que no tienes conexión a internet. Revisa tu red o intenta nuevamente.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
